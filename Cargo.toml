# ===========================================
# Cipher NFT Staking Workspace Manifest
# ===========================================

[workspace]
members = [
    "programs/cipher_nft_staking",
]
exclude = [
    "kani_verification",
]
resolver = "2"

[profile.release]
opt-level = "s"
lto = false
codegen-units = 1
panic = "abort"
overflow-checks = true
debug = false
