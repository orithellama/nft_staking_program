[package]
name = "balddev-nft-staking-verification"
version = "0.2.0"
edition = "2021"

# All proofs are self-contained pure-Rust harnesses.
# No Anchor/Solana runtime dependencies are needed —
# removing them keeps Kani compilation fast and deterministic.
[dependencies]

[lib]
name = "balddev_nft_staking_verification"
path = "src/lib.rs"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
