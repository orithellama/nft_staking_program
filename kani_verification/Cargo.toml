[package]
name = "cipher-nft-staking-verification"
version = "0.1.0"
edition = "2021"

[dependencies]
# Import NFT staking program as library for verification
cipher_nft_staking = { path = "../programs/cipher_nft_staking", features = ["no-entrypoint"] }
anchor-lang = "0.31.1"
anchor-spl = "0.31.1"

[lib]
name = "cipher_nft_staking_verification"
path = "src/lib.rs"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
